<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breathe · Little Bloom</title>
<meta name="description" content="A free month-by-month pregnancy guide: baby growth, brain development and simple activities. English, Hindi, Telugu.">
<meta name="theme-color" content="#e8637c">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/styles-v8.css">
</head>
<body data-page="breathe" data-nav="breathe">

<div class="page">
  <div class="hero">
    <h1 data-i18n="breathing_title"></h1>
    <p data-i18n="breathing_sub"></p>
  </div>
  <div class="breath-modes" style="margin-top:16px">
    <button data-mode="calm" data-i18n="mode_calm"></button>
    <button data-mode="sleep" data-i18n="mode_sleep"></button>
    <button data-mode="labor" data-i18n="mode_labor"></button>
  </div>
  <div class="breath-stage">
    <div class="breath-circle" id="bCircle">
      <div><span class="phase" id="bPhase">🌸</span><span class="count" id="bCount"></span></div>
    </div>
  </div>
  <div style="text-align:center;margin:6px 0 14px">
    <span class="pill" id="bCyclesWrap"><span data-i18n="cycles_done"></span>: <b id="bCycles">0</b></span>
  </div>
  <button class="btn big" id="bStart" data-i18n="start"></button>
  <div class="card" style="margin-top:16px"><ul class="line-list">
    <li><span class="dot">🧘</span><span data-i18n="breathing_tip1"></span></li>
    <li><span class="dot">⚠️</span><span data-i18n="breathing_tip2"></span></li>
    <li><span class="dot">🚫</span><span data-i18n="breathing_tip3"></span></li>
  </ul></div>
</div>

<script src="./js/i18n-v8.js"></script>
<script src="./js/content-weeks-1.js"></script>
<script src="./js/content-weeks-2.js"></script>
<script src="./js/content-weeks-3.js"></script>
<script src="./js/content-weeks-4.js"></script>
<script src="./js/content-months.js"></script>
<script src="./js/content-extra-v4.js"></script>
<script src="./js/app-v10.js"></script>
</body>
</html>
